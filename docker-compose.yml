networks:
  unisystem-net:
    driver: bridge

volumes:
  shared-db-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  maven-cache: # Named volume for maven dependencies to speed up builds

services:

  # ══════════════════════════════════════════
  #  INFRASTRUCTURE (Zookeeper, Kafka, Redis)
  # ══════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [ unisystem-net ]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [ unisystem-net ]
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [ unisystem-net ]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        echo 'Waiting for Kafka...'
        sleep 5
        kafka-topics --create --if-not-exists --topic student-enrolled --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --topic announcement-created --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --topic course-created --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --topic notification-push --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1
        echo 'Topics created:'
        kafka-topics --list --bootstrap-server kafka:29092
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [ unisystem-net ]
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  redis:
    image: redis:7.2-alpine
    container_name: redis
    networks: [ unisystem-net ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════
  #  DATABASE
  # ══════════════════════════════════════════

  shared-db:
    image: mysql:8.0.33
    container_name: shared-db
    networks: [ unisystem-net ]
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "UniSys@Db#2026"
      MYSQL_DATABASE: helwanuni
    volumes:
      - shared-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pUniSys@Db#2026" ]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: mysql:8.0.33
    container_name: db-init
    networks: [ unisystem-net ]
    depends_on:
      shared-db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: "UniSys@Db#2026"
    volumes:
      - ./init.sql:/init.sql:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        schema_exists=$$(mysql --host=shared-db --port=3306 --user=root --password="$$MYSQL_ROOT_PASSWORD" --skip-column-names --silent -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='helwanuni' AND table_name='users';")
        if [ "$$schema_exists" -gt 0 ]; then
          echo 'Database schema already exists; skipping bootstrap.'
          exit 0
        fi
        echo 'Running database bootstrap...'
        mysql --host=shared-db --port=3306 --user=root --password="$$MYSQL_ROOT_PASSWORD" --database=helwanuni < /init.sql
    restart: "no"

  # ══════════════════════════════════════════
  #  MICROSERVICES (With Hot Reload Support)
  # ══════════════════════════════════════════

  eureka-server:
    build:
      context: ./Backend/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    networks: [ unisystem-net ]
    ports:
      - "8761:8761"
    volumes:
      - ./Backend/eureka-server:/app
      - maven-cache:/root/.m2
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8761
      SPRING_DEVTOOLS_RESTART_ENABLED: 'true'
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: 'false'
      EUREKA_CLIENT_FETCH_REGISTRY: 'false'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  api-gateway:
    build:
      context: ./Backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    networks: [ unisystem-net ]
    ports:
      - "8080:8080"
    volumes:
      - ./Backend/api-gateway:/app
      - maven-cache:/root/.m2
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      SPRING_DEVTOOLS_RESTART_ENABLED: 'true'
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      JWT_SECRET: mySuperSecretKey2026UniSystemXYZ!
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  iam-service:
    build:
      context: ./Backend/iam-service
      dockerfile: Dockerfile
    container_name: iam-service
    networks: [ unisystem-net ]
    ports:
      - "8081:8081"
    volumes:
      - ./Backend/iam-service:/app
      - maven-cache:/root/.m2
    depends_on:
      shared-db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: iam-service
      SERVER_PORT: 8081
      SPRING_DEVTOOLS_RESTART_ENABLED: 'true'
      SPRING_DATASOURCE_URL: jdbc:mysql://shared-db:3306/helwanuni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "UniSys@Db#2026"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
      JWT_SECRET: mySuperSecretKey2026UniSystemXYZ!
      JWT_EXPIRATION_MS: 86400000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  academic-core:
    build:
      context: ./Backend/academic-core-Service
      dockerfile: Dockerfile
    container_name: academic-core
    networks: [ unisystem-net ]
    ports:
      - "8082:8082"
    volumes:
      - ./Backend/academic-core-Service:/app
      - maven-cache:/root/.m2
    depends_on:
      shared-db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: academic-core
      SERVER_PORT: 8082
      SPRING_DEVTOOLS_RESTART_ENABLED: 'true'
      SPRING_DATASOURCE_URL: jdbc:mysql://shared-db:3306/helwanuni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "UniSys@Db#2026"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  communication-service:
    build:
      context: ./Backend/communication-service
      dockerfile: Dockerfile
    container_name: communication-service
    networks: [ unisystem-net ]
    ports:
      - "8083:8083"
    volumes:
      - ./Backend/communication-service:/app
      - maven-cache:/root/.m2
    depends_on:
      shared-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: communication-service
      SERVER_PORT: 8083
      SPRING_DEVTOOLS_RESTART_ENABLED: 'true'
      SPRING_DATASOURCE_URL: jdbc:mysql://shared-db:3306/helwanuni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "UniSys@Db#2026"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: communication-group
      JWT_SECRET: mySuperSecretKey2026UniSystemXYZ!
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ══════════════════════════════════════════
  #  FRONTEND
  # ══════════════════════════════════════════

  frontend:
    build:
      context: ./FrontEnd/my-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: frontend
    networks: [ unisystem-net ]
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd/my-app:/app # Sync frontend code for hot-reload
      - /app/node_modules # Don't sync node_modules back to host
    depends_on:
      - api-gateway