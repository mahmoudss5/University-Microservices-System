server:
  port: 8081

spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:mysql://localhost:3306/helwanuni
    username: root
    password: ${MYSQL_PASSWORD:UniSys@Db#2026}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  aop:
    proxy-target-class: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# JWT — ⚠️ Move to environment variable or secrets manager in production
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true

iam:
  seed:
    admin:
      enabled: true
      email: admin@gmail.com
      password: test1234
      username: admin
