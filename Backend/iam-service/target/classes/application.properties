server.port=8081
spring.application.name=iam-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/helwanuni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:01125867988}

# Flyway owns the schema — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT — ⚠️ Move to environment variable or secrets manager in production
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# AOP
spring.aop.proxy-target-class=true
