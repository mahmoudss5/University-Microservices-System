server.port=8081
spring.application.name=iam-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/iam_db
spring.datasource.username=postgres
spring.datasource.password=postgres
# Flyway owns the schema — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — ⚠️ Move to environment variable or secrets manager in production
jwt.secret=mySuperSecretKey2026UniSystemXYZ!
jwt.expiration-ms=86400000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
