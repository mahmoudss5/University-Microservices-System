server.port=8081
spring.application.name=iam-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/helwanuni
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:01125867988}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=false

# JWT — ⚠️ Move to environment variable or secrets manager in production
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# AOP
spring.aop.proxy-target-class=true

# Default admin (created on startup if no user exists with iam.seed.admin.email).
# Override in production via environment variables — never rely on defaults in prod.
iam.seed.admin.enabled=true
iam.seed.admin.email=admin@gmail.com
iam.seed.admin.password=test1234
iam.seed.admin.username=admin

# ─────────────────────────────────────────────────────────────────────────────
# Redis — shared instance for @RateLimit sliding-window aspect
# ─────────────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
