version: "3.9"

services:

  # ── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: iam_postgres
    environment:
      POSTGRES_DB:       iam_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── IAM Service ───────────────────────────────────────────
  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam_service
    ports:
      - "8081:8081"
    environment:
      # Override application.properties values with Docker env vars
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/iam_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED:      "true"
      JWT_SECRET:                 mySuperSecretKey2026UniSystemXYZ!
      JWT_EXPIRATION_MS:          "86400000"
      # Disable Eureka in Docker-only testing (no registry running)
      EUREKA_CLIENT_ENABLED:      "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
