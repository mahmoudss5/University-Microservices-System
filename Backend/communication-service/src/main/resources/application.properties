# ── Server ───────────────────────────────────────────────
spring.application.name=communication-service
server.port=8083

# ── MySQL ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/helwanuni
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ── Kafka ────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=communication-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ── Cache ─────────────────────────────────────────────────
spring.cache.type=simple

# ── Eureka (disabled for standalone testing) ──────────────
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-chars}

# ── Jackson ──────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Swagger ───────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/api-docs

# ── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
