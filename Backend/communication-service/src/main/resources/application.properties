# ── Server ───────────────────────────────────────────────
spring.application.name=communication-service
server.port=8083
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# ── MySQL ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/helwanuni
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:UniSys@Db#2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

# ── Kafka ────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=communication-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ── Eureka (disabled for standalone testing) ──────────────
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:local-development-secret-change-me-minimum-thirty-two-char}

# ── Jackson ──────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Swagger ───────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/api-docs

# ── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── AOP ───────────────────────────────────────────────────
spring.aop.proxy-target-class=true
