server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

jwt.secret=${JWT_SECRET:mySuperSecretKey2026UniSystemXYZ!}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# IAM SERVICE - Auth Routes (Rate Limited)
spring.cloud.gateway.routes[0].id=iam-service-auth
spring.cloud.gateway.routes[0].uri=lb://IAM-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[0].filters[0].args.deny-empty-key=false
spring.cloud.gateway.routes[0].filters[0].args.empty-key-status=INTERNAL_SERVER_ERROR
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}

# IAM SERVICE - Other Routes (Not Rate Limited)
spring.cloud.gateway.routes[1].id=iam-service-other
spring.cloud.gateway.routes[1].uri=lb://IAM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**,/api/students/**,/api/teachers/**

# ACADEMIC CORE
spring.cloud.gateway.routes[2].id=academic-core
spring.cloud.gateway.routes[2].uri=lb://ACADEMIC-CORE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/courses/**,/api/departments/**,/api/enrollments/**,/api/enrolled-courses/**,/api/announcements/**,/api/feedbacks/**

# COMMUNICATION SERVICE
spring.cloud.gateway.routes[3].id=communication-service
spring.cloud.gateway.routes[3].uri=lb://COMMUNICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**,/api/messages/**
# COMMUNICATION SERVICE - WebSocket
spring.cloud.gateway.routes[4].id=communication-service-ws
spring.cloud.gateway.routes[4].uri=lb://COMMUNICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/ws/**

# BFF (Backend for Frontend) - Dashboard Routes
# These endpoints are handled locally by the API Gateway's DashboardController
# They aggregate data from multiple services for optimized frontend consumption
# No additional route configuration needed - Spring Boot handles these via @RestController locally
