server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}

jwt.secret=${JWT_SECRET:mySuperSecretKey2026UniSystemXYZ!}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ─────────────────────────────────────────────────────────────────────────────
# Redis — used by the Lua sliding-window rate limiters
# ─────────────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ─────────────────────────────────────────────────────────────────────────────
# Rate limiting overview
# ─────────────────────────────────────────────────────────────────────────────
# Layer 1 (Global)   — GlobalRateLimiterFilter   — 150 req/min per IP on ALL routes
# Layer 2 (Per-route) — LuaRateLimiterGateway… — 20  req/min per IP on /api/auth/**
# Both layers use the same sliding-window Lua script (scripts/rate_limiter.lua).
# ─────────────────────────────────────────────────────────────────────────────

# ── IAM SERVICE — Auth Routes (Lua Sliding-Window Rate Limited: 20 req/min) ──
spring.cloud.gateway.routes[0].id=iam-service-auth
spring.cloud.gateway.routes[0].uri=lb://IAM-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=LuaRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.requestsPerMinute=20

# ── IAM SERVICE — User/Student/Teacher Routes (Global limiter only) ───────────
spring.cloud.gateway.routes[1].id=iam-service-other
spring.cloud.gateway.routes[1].uri=lb://IAM-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**,/api/students/**,/api/teachers/**

# ── ACADEMIC CORE ─────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[2].id=academic-core
spring.cloud.gateway.routes[2].uri=lb://ACADEMIC-CORE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/courses/**,/api/departments/**,/api/enrollments/**,/api/enrolled-courses/**,/api/announcements/**,/api/feedbacks/**,/api/audit-logs/**

# ── COMMUNICATION SERVICE — REST ──────────────────────────────────────────────
spring.cloud.gateway.routes[3].id=communication-service
spring.cloud.gateway.routes[3].uri=lb://COMMUNICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**,/api/messages/**

# ── COMMUNICATION SERVICE — WebSocket ────────────────────────────────────────
spring.cloud.gateway.routes[4].id=communication-service-ws
spring.cloud.gateway.routes[4].uri=lb://COMMUNICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/ws/**

# ── BFF Dashboard routes are served locally by DashboardController ────────────
# No route config needed — Spring Boot's DispatcherHandler resolves them directly.

# Remove duplicate CORS headers added by both Gateway and downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE