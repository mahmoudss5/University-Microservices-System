name: UniSystem CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  backend-Test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iam-service
            path: Backend/iam-service
            java: '17'
          - name: academic-core
            path: Backend/academic-core-Service
            java: '21'

          - name: api-gateway
            path: Backend/api-gateway
            java: '21'

          - name: communication-service
            path: Backend/communication-service
            java: '21'

          - name: eureka-server
            path: Backend/eureka-server
            java: '21'

          - name: audit-log-service
            path: Backend/AuditLogService
            java: '21'


    name: ${{ matrix.name }} Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Test service
        run: |
          mvn -f "${{ matrix.path }}/pom.xml" \
            clean verify \
            --batch-mode \
            --no-transfer-progress

      - name: Publish test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "${{ matrix.path }}/target/surefire-reports/TEST-*.xml"